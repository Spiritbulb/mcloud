name: nuru-feed
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Run feed ingestion
        env:
          CRON_SECRET: ${{ secrets.NURU_CRON_SECRET }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" https://nuru.spiritb.uk/api/cron/feed
